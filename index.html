<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Инструмент для вычислений с матрицами и решения систем линейных уравнений.">
  <title>Matrix Studio — калькулятор матриц</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="app">
    <header class="topbar">
      <div>
        <p class="eyebrow">Линейная алгебра</p>
        <h1>Matrix Studio</h1>
        <p class="subtitle">Числа разделяйте пробелами, строки — переносами.</p>
      </div>
      <button id="sample" class="quiet">Пример</button>
    </header>

    <section class="workspace">
      <section class="card editor">
        <h2>Матрицы</h2>
        <div class="matrices">
          <label>Матрица A<textarea id="matrixA" spellcheck="false">2 1 0
1 3 1
0 1 2</textarea></label>
          <label>Вектор b<textarea id="matrixB" spellcheck="false">1
2
3</textarea></label>
        </div>
        <h3>Основные действия</h3>
        <div class="buttons">
          <button data-op="add">Сложение</button>
          <button data-op="subtract">Вычитание</button>
          <button data-op="multiply">Умножение</button>
          <button data-op="transposeA">Транспонировать A</button>
          <button data-op="transposeB">Транспонировать B</button>
          <button data-op="detA">Определитель A</button>
          <button data-op="detB">Определитель B</button>
          <button data-op="inverseA">Обратная A</button>
          <button data-op="inverseB">Обратная B</button>
          <button data-op="rankA">Ранг A</button>
          <button data-op="traceA">След A</button>
          <button data-op="rrefA">Ступенчатый вид</button>
          <button data-op="cramer">Крамер</button>
          <button data-op="gauss">Гаусс</button>
        </div>
        <p class="hint">Для решений систем введите квадратную матрицу A и столбец b справа.</p>
      </section>

      <aside class="card result-card">
        <h2>Ответ</h2>
        <pre id="result" aria-live="polite">Выберите действие.</pre>
        <h2 class="steps-heading">Пошаговый ход</h2>
        <pre id="steps" aria-live="polite">Здесь появится ход решения.</pre>
      </aside>
    </section>
    <footer>Все вычисления выполняются в браузере.</footer>
  </main>
  <script src="script.js"></script>
</body>
</html>
